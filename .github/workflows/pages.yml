# Rebuilds the Print Bench page from examples/bench.json on every push to main and publishes it on GitHub Pages.
# In a fork: Settings, Pages, Source "GitHub Actions"; edit the "download" URL in examples/bench.json.
name: Print Bench page
on:
  push:
    branches: [main]
    paths: ["examples/**", "hardware/**", "tools/print_bench.py", "tools/print-bench-template.html", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p _site && python tools/print_bench.py examples/bench.json _site/index.html && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
